services:
web:
  build: .
  command: gunicorn espnet.wsgi:application --bind 0.0.0.0:8000
  volumes:
    - .:/app
  ports:
    - "8000:8000"
  environment:
    DB_HOST: db
  depends_on:
    - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: espnet_db
      POSTGRES_USER: espnet_user
      POSTGRES_PASSWORD: espnet_password
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data: