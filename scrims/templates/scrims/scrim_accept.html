{% extends 'base.html' %}
{% block title %}Accept Scrim - ESPNET{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-10">
    <div class="bg-gray-800 border border-blue-500/30 rounded-xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-violet-500"></div>
        
        <h1 class="font-heading font-black text-3xl mb-4 text-center">Accept Challenge</h1>
        
        <div class="bg-gray-900 border border-gray-700 rounded-lg p-6 mb-8 text-center relative">
            <div class="text-xl font-bold mb-2">{{ team.name }}</div>
            <div class="text-gray-500 text-sm mb-4">VS</div>
            <div class="text-xl font-bold text-blue-400">{{ scrim.requester.name }}</div>
            
            <div class="mt-6 flex justify-center items-center gap-4 text-sm text-gray-400 border-t border-gray-800 pt-4">
                <span class="bg-gray-800 px-3 py-1 rounded">{{ scrim.game }}</span>
                <span>{{ scrim.format }}</span>
                <span class="text-blue-300">{{ scrim.date_time|date:"M d, Y - g:i A" }}</span>
            </div>
        </div>

        <form method="post" class="flex flex-col gap-4">
            {% csrf_token %}
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-lg font-bold py-4 rounded-xl shadow-lg shadow-blue-500/20 transition-transform transform hover:-translate-y-1">
                Confirm Match
            </button>
            <a href="{% url 'scrims:list' %}" class="w-full text-center text-gray-400 hover:text-white py-2 transition-colors">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
