{% extends 'base.html' %}
{% block title %}Create Team - ESPNET{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10">
    <div class="bg-gray-800 border border-gray-700 rounded-xl p-8 shadow-2xl">
        <h1 class="font-heading font-black text-3xl mb-6">Forge Your Team</h1>
        
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-300 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-transform transform hover:-translate-y-0.5 shadow-lg shadow-blue-500/20">
                Initialize Team
            </button>
        </form>
    </div>
</div>
{% endblock %}
